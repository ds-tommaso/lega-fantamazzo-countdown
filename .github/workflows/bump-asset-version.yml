name: Bump asset cache version

on:
  push:
    branches: [main]
    paths:
      - "assets/css/**"
      - "assets/js/**"
      - "index.html"

permissions:
  contents: write

jobs:
  bump-version:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump ?v= query strings to current commit SHA
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i -E "s/(assets\/(css|js)\/[A-Za-z0-9_-]+\.(css|js))\?v[0-9A-Za-z.]+/\1?v${VERSION}/g" index.html

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No version bump needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: bump asset cache version to ${GITHUB_SHA::7} [skip ci]"
          git push
